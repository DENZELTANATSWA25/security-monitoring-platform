name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: security_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d security_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: apps/backend

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://admin:admin@localhost:5432/security_test_db
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-test-secret
      GEOIP_DATABASE_PATH: ""
      TRUSTED_PROXY_IPS: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create migration validation database
        working-directory: .
        env:
          PGPASSWORD: admin
        run: |
          psql \
            -h localhost \
            -U admin \
            -d postgres \
            -c "CREATE DATABASE security_migration_db;"

      - name: Validate migrations
        env:
          DATABASE_URL: postgresql+asyncpg://admin:admin@localhost:5432/security_migration_db
        run: |
          alembic upgrade head
          alembic check

      - name: Run backend test suite
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term \
            --cov-fail-under=80 \
            -q
