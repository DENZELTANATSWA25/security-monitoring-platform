version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: security_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: security_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: security_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./apps/backend
    container_name: security_backend
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://admin:REPLACE_WITH_DATABASE_PASSWORD@postgres:5432/security_db
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app

volumes:
  postgres_data: