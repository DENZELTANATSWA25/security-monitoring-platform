services:

  postgres:
    image: postgres:15
    container_name: security_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: security_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d security_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    container_name: security_redis
    restart: always
    ports:
      - "6379:6379"


  backend:
    build:
      context: ./apps/backend
    container_name: security_backend

    env_file:
      - ./apps/backend/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    ports:
      - "8000:8000"

    volumes:
      - ./apps/backend:/app

    restart: always


volumes:
  postgres_data: